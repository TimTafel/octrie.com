<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <filter id="blur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <style>
    .halo  { fill: #FFFFFF; }
    .letter { fill: #1A1A1A; }
    @media (prefers-color-scheme: dark) {
      .halo  { fill: #000000; }
      .letter { fill: #F5F5F5; }
    }
  </style>
  <text class="halo" x="18" y="18" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">O</text>
  <text class="letter" x="18" y="18" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle" dominant-baseline="central">O</text>
</svg>
