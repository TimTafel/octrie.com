<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 62">
  <defs>
    <filter id="blur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
  </defs>
  <style>
    .halo  { fill: #FFFFFF; }
    .letter { fill: #1A1A1A; }
    @media (prefers-color-scheme: dark) {
      .halo  { fill: #000000; }
      .letter { fill: #F5F5F5; }
    }
  </style>
  <text class="halo" x="31" y="31" font-family="sans-serif" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="central" filter="url(#blur)">O</text>
  <text class="letter" x="31" y="31" font-family="sans-serif" font-size="54" font-weight="900" text-anchor="middle" dominant-baseline="central">O</text>
</svg>
