<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .letter {
      fill: #1A1A1A;
      stroke: #FFFFFF;
      stroke-width: 3;
      paint-order: stroke fill;
    }
    @media (prefers-color-scheme: dark) {
      .letter {
        fill: #F5F5F5;
        stroke: #1A1A1A;
      }
    }
  </style>
  <text class="letter" x="16" y="16" font-family="sans-serif" font-size="36" font-weight="900" text-anchor="middle" dominant-baseline="central">O</text>
</svg>
